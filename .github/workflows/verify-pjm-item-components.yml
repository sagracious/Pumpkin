name: Verify PJM item and lobby compatibility

on:
  push:
    branches:
      - feat/pjm-directional-consume-effect
    paths:
      - "crates/pumpkin-data/src/data_component_impl/combat.rs"
      - "crates/pumpkin-data/src/data_component_impl/food.rs"
      - "crates/pumpkin-data/src/data_component_impl/utility.rs"
      - "crates/pumpkin-data/src/generated/item.rs"
      - "crates/pumpkin-plugin-api/src/events/packet.rs"
      - "crates/pumpkin-protocol/src/codec/data_component.rs"
      - "crates/pumpkin/src/entity/player.rs"
      - "crates/pumpkin/src/entity/living.rs"
      - "crates/pumpkin/src/net/java/mod.rs"
      - "crates/pumpkin/src/net/java/login/plugin_response.rs"
      - "crates/pumpkin/src/net/java/pending.rs"
      - "crates/pumpkin/src/net/java/play/confirm_teleport.rs"
      - "crates/pumpkin/src/net/proxy/velocity.rs"
      - "crates/pumpkin/src/net/proxy/vine.rs"
      - "crates/pumpkin/src/plugin/api/events/server/protocol_packet.rs"
      - "crates/pumpkin/src/plugin/loader/wasm/wasm_host/wit/v0_1/events/server.rs"
      - "crates/pumpkin-plugin-wit/v0.1/event.wit"
      - "crates/pumpkin/src/server/connection_cache.rs"
      - "crates/pumpkin/src/world/mod.rs"
      - "tools/pumpkin-codegen/src/item.rs"
      - ".github/workflows/verify-pjm-item-components.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pjm-item-components-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: pjm-item-components

      - name: Format changed sources
        run: >-
          rustfmt --edition 2024 --check
          crates/pumpkin-data/src/data_component_impl/combat.rs
          crates/pumpkin-data/src/data_component_impl/food.rs
          crates/pumpkin-data/src/data_component_impl/utility.rs
          crates/pumpkin-protocol/src/codec/data_component.rs
          crates/pumpkin-plugin-api/src/events/packet.rs
          crates/pumpkin/src/entity/player.rs
          crates/pumpkin/src/entity/living.rs
          crates/pumpkin/src/net/java/mod.rs
          crates/pumpkin/src/net/java/login/plugin_response.rs
          crates/pumpkin/src/net/java/pending.rs
          crates/pumpkin/src/net/java/play/confirm_teleport.rs
          crates/pumpkin/src/net/proxy/velocity.rs
          crates/pumpkin/src/net/proxy/vine.rs
          crates/pumpkin/src/plugin/api/events/server/protocol_packet.rs
          crates/pumpkin/src/plugin/loader/wasm/wasm_host/wit/v0_1/events/server.rs
          crates/pumpkin/src/server/connection_cache.rs
          crates/pumpkin/src/world/mod.rs
          tools/pumpkin-codegen/src/item.rs

      - name: Test affected packages
        run: >-
          cargo test --locked
          -p pumpkin-data
          -p pumpkin-protocol
          -p pumpkin-plugin-api
          -p pumpkin-codegen
          -p pumpkin
