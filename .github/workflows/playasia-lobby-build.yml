name: PlayAsia lobby build

on:
  push:
    branches:
      - fix/pjm-packet-sent
      - feat/pjm-event-context
      - feat/pjm-raw-packet-events
      - feat/pjm-directional-consume-effect
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "assets/**"
      - ".github/workflows/playasia-lobby-build.yml"
  workflow_dispatch:

concurrency:
  group: playasia-lobby-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - parallel:
          - uses: dtolnay/rust-toolchain@stable
            with:
              # Pinned: stable rolled 1.98.1 -> 1.99.0 and 1.99.0 SIGSEGVs on
              # pumpkin-data. Re-pin deliberately, never float here.
              toolchain: 1.98.1
          - name: Run sccache cache
            uses: mozilla-actions/sccache-action@v0.0.11
            with:
              disable_annotations: true
          - uses: Swatinem/rust-cache@v2
            with:
              # The previous cache deliberately excluded workspace crates, so each
              # tiny protocol edit rebuilt every local crate from scratch.
              # Bump this when the iterative profile changes so old release/LTO
              # artifacts are not restored and recompiled under a new fingerprint.
              # v3: cold cache after repeated rustc SIGSEGV on restored artifacts.
              prefix-key: v3-playasia-lobby
              # sccache below owns workspace compiler outputs; keep this cache for
              # Cargo's registry and git dependencies only.
              cache-workspace-crates: false

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang

      - name: Build Pumpkin
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          # rustc SIGSEGVs in MIR match lowering on giant generated matches
          # (pumpkin-data); raise the driver stack. Revisit if profile changes.
          RUST_MIN_STACK: "33554432"
          # mold links the 220 MB binary far faster than GNU ld; same code in,
          # same bytes out semantically. First build after this change
          # re-keys the sccache cache once.
          RUSTFLAGS: "-Dwarnings -C linker=clang -C link-arg=-fuse-ld=mold"
        run: cargo build --profile playasia-lobby --package pumpkin --bin pumpkin --locked

      - name: Show compiler cache stats
        if: always()
        run: sccache --show-stats

      - name: Package binary and hash
        run: |
          mkdir -p dist
          cp target/playasia-lobby/pumpkin dist/pumpkin
          sha256sum dist/pumpkin > dist/pumpkin.sha256
          git rev-parse HEAD > dist/SOURCE_REV
          sccache --show-stats > dist/BUILD_CACHE_STATS.txt 2>&1 || true

      - uses: actions/upload-artifact@v7
        with:
          name: pumpkin-playasia-lobby-linux-x64
          path: dist/
          compression-level: 1
